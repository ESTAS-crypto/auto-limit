<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quota Radar: Ikon dan stiker</title>
<link rel="stylesheet" href="../css/quota.css">
<link rel="stylesheet" href="../css/quota2.css">

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>

<style>html,body{background:#0C0E13}</style>
</head>
<body>


<div class="pg" style="min-height:820px"><div class="wrap">
<div class="top rise"><div class="brand disp"><i class="logo"></i>Quota Radar</div><nav class="nav" aria-label="Menu utama"><a class="nv" href="#"><i class="ic ic-radar"></i>Dashboard</a><a class="nv" href="#"><i class="ic ic-stack"></i>Akun</a><a class="nv" href="#"><i class="ic ic-bell"></i>Notifikasi</a><a class="nv" href="#"><i class="ic ic-loop"></i>Rotasi</a></nav></div>
<div class="rise" style="--i:2;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-top:40px"><div><h1 class="h1">Ikon dan stiker</h1><p class="sub p">Set ikon garis custom dan maskot Blip dengan tiga suasana.</p></div></div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px;margin-top:28px"><div class="cell rise" style="--i:3"><i class="ic ic-radar" style="width:34px;height:34px"></i>Dashboard</div><div class="cell rise" style="--i:4"><i class="ic ic-stack" style="width:34px;height:34px"></i>Akun</div><div class="cell rise" style="--i:5"><i class="ic ic-bell" style="width:34px;height:34px"></i>Notifikasi</div><div class="cell rise" style="--i:6"><i class="ic ic-loop" style="width:34px;height:34px"></i>Rotasi</div><div class="cell rise" style="--i:7"><i class="ic ic-plus" style="width:34px;height:34px"></i>Tambah</div><div class="cell rise" style="--i:8"><i class="ic ic-bolt" style="width:34px;height:34px"></i>Kuota</div><div class="cell rise" style="--i:9"><i class="ic ic-chat" style="width:34px;height:34px"></i>Discord</div><div class="cell rise" style="--i:10"><i class="ic ic-shield" style="width:34px;height:34px"></i>Aman</div><div class="cell rise" style="--i:11"><i class="ic ic-clock" style="width:34px;height:34px"></i>Reset</div><div class="cell rise" style="--i:12"><i class="ic ic-pause" style="width:34px;height:34px"></i>Jeda</div><div class="cell rise" style="--i:13"><i class="ic ic-link" style="width:34px;height:34px"></i>Hubungkan</div><div class="cell rise" style="--i:14"><i class="ic ic-check" style="width:34px;height:34px"></i>Selesai</div></div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:28px"><div class="card rise" style="--i:16;padding:24px;display:grid;gap:12px;justify-items:center"><i class="stk stk-ok" style="width:120px;height:120px"></i><span class="sub">Blip senang · akun sehat</span></div><div class="card rise" style="--i:17;padding:24px;display:grid;gap:12px;justify-items:center"><i class="stk stk-warn" style="width:120px;height:120px"></i><span class="sub">Blip cemas · hampir limit</span></div><div class="card rise" style="--i:18;padding:24px;display:grid;gap:12px;justify-items:center"><i class="stk stk-sleep" style="width:120px;height:120px"></i><span class="sub">Blip tidur · kena limit</span></div></div>
</div></div>

</body>
</html>
