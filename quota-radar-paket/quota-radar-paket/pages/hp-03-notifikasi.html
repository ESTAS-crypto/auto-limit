<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quota Radar: Notifikasi</title>
<link rel="stylesheet" href="../css/quota.css">
<link rel="stylesheet" href="../css/quota2.css">

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
body{margin:0}
.root{position:relative;width:390px;height:844px;overflow:hidden;box-sizing:border-box;background:#0C0E13;color:#E8EAF0;font-family:Inter,system-ui,sans-serif;padding:22px 18px 0}
.bar{height:8px;border-radius:99px;background:#222836;overflow:hidden}
.fill{height:100%;width:calc(var(--v)*1%);border-radius:99px;background:var(--c);transform-origin:left;animation:grow 1.5s cubic-bezier(.2,.8,.2,1) .4s both}
.track{fill:none;stroke:#222836;stroke-width:6}
.ring{fill:none;stroke:var(--c);stroke-width:6;stroke-linecap:round;stroke-dasharray:163.4;stroke-dashoffset:var(--o);transform:rotate(-90deg);transform-box:fill-box;transform-origin:center;animation:draw 1.7s cubic-bezier(.2,.8,.2,1) .3s both}
@keyframes draw{from{stroke-dashoffset:163.4}}
.rw{position:relative;flex:none}
.rw b{position:absolute;inset:0;display:grid;place-items:center}
.row{display:flex;justify-content:space-between;font-size:12px;color:#9AA1B2;margin-bottom:5px}
.mc{padding:16px}
.mc:hover{transform:none}
.tbar{position:absolute;left:0;right:0;bottom:0;height:84px;box-sizing:border-box;padding:10px 12px 0;display:flex;justify-content:space-around;background:#12151C;border-top:1px solid #232834}
.tb{display:grid;justify-items:center;align-content:center;gap:4px;min-width:72px;height:56px;border-radius:14px;font-size:11px;color:#9AA1B2;transition:all .3s cubic-bezier(.2,.8,.2,1)}
.tb:hover{color:#E8EAF0}
.tb[aria-current="page"]{color:#4ADE9A;background:rgba(74,222,154,.1)}
.av{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);font-size:13px;flex:none}
.pill{padding:10px 16px;border-radius:99px;background:#14171F;border:1px solid #232834;color:#9AA1B2;font-size:13px;white-space:nowrap}
.pill[aria-pressed="true"]{background:#E8EAF0;color:#0C0E13;border-color:#E8EAF0}
</style>

<style>html,body{background:#0C0E13}</style>
</head>
<body>


<div class="root">
<div class="rise" style="display:flex;align-items:center;justify-content:space-between"><div class="brand disp" style="font-size:20px"><i class="logo" style="width:34px;height:34px"></i>Quota Radar</div><span class="chip" style="--c:#4ADE9A"><i class="dot"></i>Live</span></div><h1 class="h1 rise" style="--i:2;font-size:34px;margin-top:22px">Notifikasi Discord</h1><div class="card rise mc" style="--i:3;margin-top:18px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><span class="t">Webhook</span><span class="chip" style="--c:#4ADE9A"><i class="dot"></i>Terhubung</span></div><label class="lbl" for="wh">URL webhook</label><input class="in mono" id="wh" placeholder="[URL WEBHOOK]" style="font-size:13px"><button class="btn pri flash" style="width:100%;justify-content:center;margin-top:14px;min-height:46px"><span class="l"><i class="ic ic-chat"></i>Tes kirim</span><span class="c" aria-hidden="true"><i class="ic ic-check"></i>Terkirim</span></button></div><div class="card rise mc" style="--i:4;margin-top:12px;padding:6px 16px"><div class="t" style="padding:12px 0 2px">Kapan dikirim</div><div class="opt" style="padding:13px 0"><div><div class="t" style="font-size:14px">Kuota hampir habis</div><div class="sub">Di bawah ambang</div></div><label class="sw2"><input type="checkbox" role="switch" aria-label="Kuota hampir habis" checked><i></i></label></div><div class="opt" style="padding:13px 0"><div><div class="t" style="font-size:14px">Akun kena limit</div><div class="sub">Sisa kuota 0%</div></div><label class="sw2"><input type="checkbox" role="switch" aria-label="Akun kena limit" checked><i></i></label></div><div class="opt" style="padding:13px 0"><div><div class="t" style="font-size:14px">Akun pulih</div><div class="sub">Setelah reset</div></div><label class="sw2"><input type="checkbox" role="switch" aria-label="Akun pulih" checked><i></i></label></div><div class="opt" style="padding:13px 0"><div><div class="t" style="font-size:14px">Ringkasan harian</div><div class="sub">Rekap tiap pagi</div></div><label class="sw2"><input type="checkbox" role="switch" aria-label="Ringkasan harian"><i></i></label></div></div>
<nav class="tbar" aria-label="Menu utama"><a class="tb" href="#"><i class="ic ic-radar" style="width:24px;height:24px"></i>Dashboard</a><a class="tb" href="#"><i class="ic ic-stack" style="width:24px;height:24px"></i>Akun</a><a class="tb" href="#" aria-current="page"><i class="ic ic-bell" style="width:24px;height:24px"></i>Notif</a><a class="tb" href="#"><i class="ic ic-loop" style="width:24px;height:24px"></i>Rotasi</a></nav>
</div>

</body>
</html>
